<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Flappy Dog - A fun flying dog game">
    <title>Flappy Dog 🐕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #gameCanvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 
                        0 0 40px rgba(79, 172, 254, 0.2);
            touch-action: manipulation;
        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        #startScreen, #gameOverScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            pointer-events: auto;
        }

        #startScreen.hidden, #gameOverScreen.hidden {
            display: none;
        }

        .title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 20px rgba(79, 172, 254, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
        }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            padding: 1rem 2.5rem;
            font-size: clamp(1rem, 3vw, 1.2rem);
            font-weight: 600;
            color: #1a1a2e;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(79, 172, 254, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .score-display {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 30px rgba(255, 255, 255, 0.3);
            margin: 1rem 0;
        }

        .high-score {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: #ffd700;
            margin-bottom: 1.5rem;
        }

        #currentScore {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 800;
            color: #fff;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #currentScore.visible {
            opacity: 1;
        }

        .instructions {
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            color: rgba(255, 255, 255, 0.6);
            margin-top: 1.5rem;
        }

        .dog-emoji {
            font-size: clamp(3rem, 10vw, 5rem);
            margin-bottom: 1rem;
            animation: bounce 1s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui">
            <div id="currentScore">0</div>
            
            <div id="startScreen">
                <div class="dog-emoji">🐕</div>
                <h1 class="title">Flappy Dog</h1>
                <p class="subtitle">Help the flying dog navigate through the pipes!</p>
                <button class="btn" id="startBtn">Play</button>
                <p class="instructions">Tap, Click or Press Space to fly</p>
            </div>
            
            <div id="gameOverScreen" class="hidden">
                <h2 class="title">Game Over</h2>
                <div class="score-display" id="finalScore">0</div>
                <p class="high-score">Best: <span id="highScore">0</span></p>
                <button class="btn" id="restartBtn">Play Again</button>
                <p class="instructions">Tap, Click or Press Space to restart</p>
            </div>
        </div>
    </div>

    <script>
        // Game Configuration
        const CONFIG = {
            // Physics
            GRAVITY: 0.5,
            JUMP_FORCE: -9,
            
            // Pipes
            PIPE_WIDTH: 70,
            PIPE_GAP: 180,
            PIPE_SPEED: 3,
            PIPE_SPAWN_INTERVAL: 1800,
            
            // Dog
            DOG_WIDTH: 50,
            DOG_HEIGHT: 40,
            DOG_X_POSITION: 0.2, // 20% from left
            
            // Colors
            SKY_GRADIENT: ['#87CEEB', '#4facfe', '#00f2fe'],
            GROUND_COLOR: '#2d5a27',
            PIPE_COLOR: '#43a047',
            PIPE_HIGHLIGHT: '#66bb6a',
            PIPE_SHADOW: '#2e7d32'
        };

        // Game State
        class GameState {
            constructor() {
                this.reset();
                this.highScore = parseInt(localStorage.getItem('flappyDogHighScore')) || 0;
            }

            reset() {
                this.isPlaying = false;
                this.isGameOver = false;
                this.score = 0;
                this.pipes = [];
                this.lastPipeSpawn = 0;
            }

            saveHighScore() {
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    try {
                        localStorage.setItem('flappyDogHighScore', this.highScore.toString());
                    } catch (e) {
                        // localStorage not available
                    }
                }
            }
        }

        // Dog Class
        class Dog {
            constructor(canvas) {
                this.canvas = canvas;
                this.reset();
            }

            reset() {
                this.x = this.canvas.width * CONFIG.DOG_X_POSITION;
                this.y = this.canvas.height / 2;
                this.velocity = 0;
                this.rotation = 0;
                this.wingPhase = 0;
            }

            jump() {
                this.velocity = CONFIG.JUMP_FORCE;
            }

            update() {
                this.velocity += CONFIG.GRAVITY;
                this.y += this.velocity;
                
                // Rotation based on velocity
                this.rotation = Math.min(Math.max(this.velocity * 3, -30), 70);
                
                // Wing animation
                this.wingPhase += 0.3;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + CONFIG.DOG_WIDTH / 2, this.y + CONFIG.DOG_HEIGHT / 2);
                ctx.rotate(this.rotation * Math.PI / 180);
                
                const w = CONFIG.DOG_WIDTH;
                const h = CONFIG.DOG_HEIGHT;
                
                // Wings (animated)
                const wingOffset = Math.sin(this.wingPhase) * 8;
                ctx.fillStyle = '#f5deb3';
                
                // Left wing
                ctx.beginPath();
                ctx.ellipse(-w * 0.2, wingOffset, w * 0.25, h * 0.15, -0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // Right wing
                ctx.beginPath();
                ctx.ellipse(-w * 0.2, -wingOffset, w * 0.25, h * 0.15, 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // Body
                const bodyGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 0.4);
                bodyGradient.addColorStop(0, '#d4a574');
                bodyGradient.addColorStop(1, '#8b6914');
                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.ellipse(0, 0, w * 0.4, h * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Head
                const headX = w * 0.25;
                const headGradient = ctx.createRadialGradient(headX, -h * 0.1, 0, headX, -h * 0.1, w * 0.28);
                headGradient.addColorStop(0, '#d4a574');
                headGradient.addColorStop(1, '#8b6914');
                ctx.fillStyle = headGradient;
                ctx.beginPath();
                ctx.ellipse(headX, -h * 0.1, w * 0.28, h * 0.32, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Ears
                ctx.fillStyle = '#6b4423';
                // Left ear
                ctx.beginPath();
                ctx.ellipse(headX - w * 0.15, -h * 0.35, w * 0.1, h * 0.15, -0.5, 0, Math.PI * 2);
                ctx.fill();
                // Right ear
                ctx.beginPath();
                ctx.ellipse(headX + w * 0.15, -h * 0.35, w * 0.1, h * 0.15, 0.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Snout
                ctx.fillStyle = '#c9a066';
                ctx.beginPath();
                ctx.ellipse(headX + w * 0.15, h * 0.05, w * 0.15, h * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Nose
                ctx.fillStyle = '#1a1a1a';
                ctx.beginPath();
                ctx.ellipse(headX + w * 0.25, h * 0.02, w * 0.06, h * 0.05, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(headX + w * 0.05, -h * 0.15, w * 0.08, h * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#3a2412';
                ctx.beginPath();
                ctx.ellipse(headX + w * 0.07, -h * 0.14, w * 0.04, h * 0.06, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Eye shine
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(headX + w * 0.09, -h * 0.17, w * 0.02, 0, Math.PI * 2);
                ctx.fill();
                
                // Tail
                ctx.strokeStyle = '#8b6914';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';
                ctx.beginPath();
                const tailWag = Math.sin(this.wingPhase * 2) * 10;
                ctx.moveTo(-w * 0.35, 0);
                ctx.quadraticCurveTo(-w * 0.5, tailWag, -w * 0.45, -h * 0.2 + tailWag * 0.5);
                ctx.stroke();
                
                // Cape (superhero style)
                ctx.fillStyle = 'rgba(220, 20, 60, 0.8)';
                ctx.beginPath();
                ctx.moveTo(-w * 0.1, -h * 0.2);
                ctx.quadraticCurveTo(-w * 0.4, 0, -w * 0.5, h * 0.4);
                ctx.lineTo(-w * 0.3, h * 0.3);
                ctx.quadraticCurveTo(-w * 0.25, 0, -w * 0.1, h * 0.1);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x + 5,
                    y: this.y + 5,
                    width: CONFIG.DOG_WIDTH - 10,
                    height: CONFIG.DOG_HEIGHT - 10
                };
            }
        }

        // Pipe Class
        class Pipe {
            constructor(x, gapY, canvasHeight) {
                this.x = x;
                this.gapY = gapY;
                this.width = CONFIG.PIPE_WIDTH;
                this.gap = CONFIG.PIPE_GAP;
                this.canvasHeight = canvasHeight;
                this.scored = false;
            }

            update() {
                this.x -= CONFIG.PIPE_SPEED;
            }

            draw(ctx) {
                const capHeight = 30;
                const capOverhang = 8;
                
                // Top pipe
                this.drawPipeSection(ctx, 0, this.gapY - this.gap / 2, false, capHeight, capOverhang);
                
                // Bottom pipe
                this.drawPipeSection(ctx, this.gapY + this.gap / 2, this.canvasHeight, true, capHeight, capOverhang);
            }

            drawPipeSection(ctx, startY, endY, isBottom, capHeight, capOverhang) {
                const pipeHeight = endY - startY;
                
                // Main pipe body
                const gradient = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
                gradient.addColorStop(0, CONFIG.PIPE_SHADOW);
                gradient.addColorStop(0.2, CONFIG.PIPE_COLOR);
                gradient.addColorStop(0.5, CONFIG.PIPE_HIGHLIGHT);
                gradient.addColorStop(0.8, CONFIG.PIPE_COLOR);
                gradient.addColorStop(1, CONFIG.PIPE_SHADOW);
                
                ctx.fillStyle = gradient;
                ctx.fillRect(this.x, startY, this.width, pipeHeight);
                
                // Pipe cap
                const capY = isBottom ? startY - capHeight / 2 : endY - capHeight / 2;
                const capGradient = ctx.createLinearGradient(this.x - capOverhang, 0, this.x + this.width + capOverhang, 0);
                capGradient.addColorStop(0, CONFIG.PIPE_SHADOW);
                capGradient.addColorStop(0.15, CONFIG.PIPE_COLOR);
                capGradient.addColorStop(0.5, CONFIG.PIPE_HIGHLIGHT);
                capGradient.addColorStop(0.85, CONFIG.PIPE_COLOR);
                capGradient.addColorStop(1, CONFIG.PIPE_SHADOW);
                
                ctx.fillStyle = capGradient;
                ctx.beginPath();
                ctx.roundRect(this.x - capOverhang, capY, this.width + capOverhang * 2, capHeight, 5);
                ctx.fill();
                
                // Highlight line
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.x + 8, startY + (isBottom ? capHeight : 0));
                ctx.lineTo(this.x + 8, endY - (isBottom ? 0 : capHeight));
                ctx.stroke();
            }

            isOffScreen() {
                return this.x + this.width < 0;
            }

            checkCollision(dogBounds) {
                const topPipe = {
                    x: this.x,
                    y: 0,
                    width: this.width,
                    height: this.gapY - this.gap / 2
                };
                
                const bottomPipe = {
                    x: this.x,
                    y: this.gapY + this.gap / 2,
                    width: this.width,
                    height: this.canvasHeight - (this.gapY + this.gap / 2)
                };
                
                return this.rectCollision(dogBounds, topPipe) || this.rectCollision(dogBounds, bottomPipe);
            }

            rectCollision(r1, r2) {
                return r1.x < r2.x + r2.width &&
                       r1.x + r1.width > r2.x &&
                       r1.y < r2.y + r2.height &&
                       r1.y + r1.height > r2.y;
            }
        }

        // Main Game Class
        class FlappyDogGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.state = new GameState();
                this.dog = null;
                this.clouds = [];
                this.groundOffset = 0;
                
                // UI Elements
                this.startScreen = document.getElementById('startScreen');
                this.gameOverScreen = document.getElementById('gameOverScreen');
                this.currentScoreEl = document.getElementById('currentScore');
                this.finalScoreEl = document.getElementById('finalScore');
                this.highScoreEl = document.getElementById('highScore');
                
                this.init();
            }

            init() {
                this.setupCanvas();
                this.setupEventListeners();
                this.generateClouds();
                this.dog = new Dog(this.canvas);
                this.updateHighScoreDisplay();
                this.gameLoop();
            }

            setupCanvas() {
                const resize = () => {
                    const container = document.getElementById('gameContainer');
                    const containerWidth = container.clientWidth;
                    const containerHeight = container.clientHeight;
                    
                    // Maintain aspect ratio
                    const aspectRatio = 9 / 16;
                    let width = Math.min(containerWidth * 0.95, 500);
                    let height = width / aspectRatio;
                    
                    if (height > containerHeight * 0.95) {
                        height = containerHeight * 0.95;
                        width = height * aspectRatio;
                    }
                    
                    this.canvas.width = width;
                    this.canvas.height = height;
                    
                    // Adjust game config based on canvas size
                    CONFIG.PIPE_GAP = Math.max(140, height * 0.22);
                    CONFIG.PIPE_WIDTH = Math.max(50, width * 0.14);
                    CONFIG.DOG_WIDTH = Math.max(35, width * 0.1);
                    CONFIG.DOG_HEIGHT = CONFIG.DOG_WIDTH * 0.8;
                    
                    if (this.dog) {
                        this.dog.x = this.canvas.width * CONFIG.DOG_X_POSITION;
                    }
                };
                
                resize();
                window.addEventListener('resize', resize);
            }

            setupEventListeners() {
                const handleInput = (e) => {
                    e.preventDefault();
                    
                    if (!this.state.isPlaying && !this.state.isGameOver) {
                        this.startGame();
                    } else if (this.state.isPlaying) {
                        this.dog.jump();
                    } else if (this.state.isGameOver) {
                        this.restartGame();
                    }
                };

                // Keyboard
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space' || e.code === 'ArrowUp') {
                        handleInput(e);
                    }
                });

                // Mouse
                this.canvas.addEventListener('click', handleInput);
                this.canvas.addEventListener('mousedown', handleInput);

                // Touch
                this.canvas.addEventListener('touchstart', handleInput, { passive: false });

                // Buttons
                document.getElementById('startBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.startGame();
                });
                
                document.getElementById('restartBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.restartGame();
                });
            }

            generateClouds() {
                this.clouds = [];
                for (let i = 0; i < 5; i++) {
                    this.clouds.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height * 0.5,
                        size: 30 + Math.random() * 40,
                        speed: 0.3 + Math.random() * 0.3
                    });
                }
            }

            startGame() {
                this.state.reset();
                this.state.isPlaying = true;
                this.dog.reset();
                this.startScreen.classList.add('hidden');
                this.gameOverScreen.classList.add('hidden');
                this.currentScoreEl.classList.add('visible');
                this.dog.jump();
            }

            restartGame() {
                this.startGame();
            }

            gameOver() {
                this.state.isPlaying = false;
                this.state.isGameOver = true;
                this.state.saveHighScore();
                
                this.currentScoreEl.classList.remove('visible');
                this.finalScoreEl.textContent = this.state.score;
                this.updateHighScoreDisplay();
                this.gameOverScreen.classList.remove('hidden');
            }

            updateHighScoreDisplay() {
                this.highScoreEl.textContent = this.state.highScore;
            }

            update() {
                if (!this.state.isPlaying) return;
                
                // Update dog
                this.dog.update();
                
                // Check boundaries
                if (this.dog.y < 0 || this.dog.y + CONFIG.DOG_HEIGHT > this.canvas.height) {
                    this.gameOver();
                    return;
                }
                
                // Spawn pipes
                const now = Date.now();
                if (now - this.state.lastPipeSpawn > CONFIG.PIPE_SPAWN_INTERVAL) {
                    const minGapY = CONFIG.PIPE_GAP / 2 + 50;
                    const maxGapY = this.canvas.height - CONFIG.PIPE_GAP / 2 - 50;
                    const gapY = minGapY + Math.random() * (maxGapY - minGapY);
                    
                    this.state.pipes.push(new Pipe(this.canvas.width, gapY, this.canvas.height));
                    this.state.lastPipeSpawn = now;
                }
                
                // Update pipes
                const dogBounds = this.dog.getBounds();
                
                for (let i = this.state.pipes.length - 1; i >= 0; i--) {
                    const pipe = this.state.pipes[i];
                    pipe.update();
                    
                    // Check collision
                    if (pipe.checkCollision(dogBounds)) {
                        this.gameOver();
                        return;
                    }
                    
                    // Score
                    if (!pipe.scored && pipe.x + pipe.width < this.dog.x) {
                        pipe.scored = true;
                        this.state.score++;
                        this.currentScoreEl.textContent = this.state.score;
                    }
                    
                    // Remove off-screen pipes
                    if (pipe.isOffScreen()) {
                        this.state.pipes.splice(i, 1);
                    }
                }
                
                // Update ground
                this.groundOffset = (this.groundOffset + CONFIG.PIPE_SPEED) % 40;
            }

            draw() {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;
                
                // Sky gradient
                const skyGradient = ctx.createLinearGradient(0, 0, 0, h);
                skyGradient.addColorStop(0, '#87CEEB');
                skyGradient.addColorStop(0.5, '#b4e4ff');
                skyGradient.addColorStop(1, '#e8f4ff');
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, w, h);
                
                // Clouds
                this.drawClouds(ctx);
                
                // Pipes
                for (const pipe of this.state.pipes) {
                    pipe.draw(ctx);
                }
                
                // Ground
                this.drawGround(ctx);
                
                // Dog
                this.dog.draw(ctx);
            }

            drawClouds(ctx) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                
                for (const cloud of this.clouds) {
                    // Move clouds
                    if (this.state.isPlaying) {
                        cloud.x -= cloud.speed;
                        if (cloud.x + cloud.size < 0) {
                            cloud.x = this.canvas.width + cloud.size;
                            cloud.y = Math.random() * this.canvas.height * 0.4;
                        }
                    }
                    
                    // Draw cloud
                    const s = cloud.size;
                    ctx.beginPath();
                    ctx.arc(cloud.x, cloud.y, s * 0.5, 0, Math.PI * 2);
                    ctx.arc(cloud.x + s * 0.4, cloud.y - s * 0.1, s * 0.35, 0, Math.PI * 2);
                    ctx.arc(cloud.x + s * 0.7, cloud.y, s * 0.4, 0, Math.PI * 2);
                    ctx.arc(cloud.x + s * 0.35, cloud.y + s * 0.1, s * 0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            drawGround(ctx) {
                const groundHeight = 20;
                const y = this.canvas.height - groundHeight;
                
                // Ground base
                const groundGradient = ctx.createLinearGradient(0, y, 0, this.canvas.height);
                groundGradient.addColorStop(0, '#4a7c3f');
                groundGradient.addColorStop(0.3, '#3d6b34');
                groundGradient.addColorStop(1, '#2d5a27');
                ctx.fillStyle = groundGradient;
                ctx.fillRect(0, y, this.canvas.width, groundHeight);
                
                // Grass pattern
                ctx.strokeStyle = '#5a9c4f';
                ctx.lineWidth = 2;
                
                for (let x = -this.groundOffset; x < this.canvas.width + 40; x += 20) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + 5, y - 8);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(x + 8, y);
                    ctx.lineTo(x + 12, y - 6);
                    ctx.stroke();
                }
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // Start the game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new FlappyDogGame();
        });

        // Polyfill for roundRect if not available
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }
    </script>
</body>
</html>
