<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Flappy Dog</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="game" aria-label="Flappy Dog game">
      <canvas id="gameCanvas" role="img" aria-label="Flappy Dog game"></canvas>
      <div class="hud">
        <div class="score" id="score">0</div>
        <div class="best" id="best">Best: 0</div>
      </div>
      <div class="overlay" id="overlay" aria-live="polite">
        <div class="card">
          <h1 id="title">Flappy Dog</h1>
          <p id="message">Tap, click, or press Space to flap.</p>
          <button id="startBtn" type="button">Start</button>
        </div>
      </div>
      <div class="hint" id="hint">Tap to flap</div>
    </main>
    <script src="game.js" defer></script>
  </body>
</html>
